# Guard de invalidação da aprovação de capability spec (specs/<capability>/<capability>.md).
#
# A aprovação é registrada pelo /approve (spec-approve.yml) num commit que só preenche
# approved_by/approved_at e promove status a ratified. Se a spec muda depois disso, a aprovação não cobre mais o
# conteúdo e este check fica VERMELHO até alguém revisar e comentar /approve de novo.
# Regra completa no docstring de .github/scripts/spec_aprovacao.py.
#
# Sem filtro de paths de propósito: com filtro, um push que não mexe em specs/ deixaria o
# head novo SEM este check, e o vermelho do head anterior sumiria da tela do PR.
name: spec-approval-guard

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: spec-approval-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aprovacao-valida:
    name: Aprovação de spec válida
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Head do PR (não o merge commit de refs/pull/N/merge): a regra compara commits do
      # próprio branch. Histórico completo para achar o merge-base com a base.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # O script de verificação vem do branch base, nunca do PR (mesma regra do /approve):
      # 1. um PR não pode editar o próprio guard para passar;
      # 2. as duas metades usam a mesma regra. Um PR criado antes de uma mudança da regra
      #    rodava o script velho do próprio branch e recusava a aprovação recém-gravada
      #    pelo /approve com o script novo (cbdigital#311).
      - name: Checkout do script (branch base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: ferramenta
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Verifica se nenhuma spec mudou depois de aprovada
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 ferramenta/.github/scripts/spec_aprovacao.py verificar --base "origin/$BASE_REF"
