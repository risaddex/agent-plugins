# Aprovação humana de capability spec via comentário `/approve` no PR.
#
# Comentário exatamente `/approve` num PR que altera specs/<capability>/<capability>.md
# preenche approved_by (login de quem comentou) e approved_at (hora do comentário, UTC) no
# front matter, num commit do github-actions[bot] no branch do PR. Não mexe em `status`:
# a promoção a ratified acontece no merge humano do PR da spec.
#
# Por que comentário e não botão: PR não tem botão customizável; o "requested action" de
# check run só existe para GitHub App, e issue_comment funciona com o GITHUB_TOKEN.
#
# Por que não exige o arquivo marcado como "Viewed": o GitHub só expõe esse estado para o
# próprio usuário do token (GraphQL PullRequestChangedFile.viewerViewedState), e o token
# aqui é do bot. Em troca, a aprovação só vale para o head que existia quando o comentário
# foi feito (push depois do comentário = recusa) e quem comenta precisa de escrita no repo.
# O spec-approval-guard.yml invalida a aprovação se a spec mudar depois.
#
# ATENÇÃO: issue_comment só dispara a partir da cópia deste arquivo no branch default do repositório.
name: spec-approve

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  aprovar:
    name: Aprova spec via /approve
    # Filtro barato aqui; a checagem exata (corpo == /approve) fica no passo `pre`.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # commit da aprovação no branch do PR
      issues: write          # resposta e reação no comentário
      pull-requests: read    # head/base/fork do PR
    # Uma aprovação por PR por vez; não cancela a que está empurrando commit.
    # No nível do job (e não do workflow) para que comentários comuns, cujo job é pulado,
    # não entrem na fila e cancelem um /approve pendente.
    concurrency:
      group: spec-approve-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      LOGIN: ${{ github.event.comment.user.login }}
      COMENTARIO_ID: ${{ github.event.comment.id }}
      COMENTARIO_EM: ${{ github.event.comment.created_at }}
      COMENTARIO_URL: ${{ github.event.comment.html_url }}
      # Corpo do comentário só entra via env, nunca interpolado no script (injeção).
      CORPO: ${{ github.event.comment.body }}
    steps:
      - name: Valida comando, permissão e head revisado
        id: pre
        run: |
          set -euo pipefail
          resposta="$RUNNER_TEMP/resposta.md"
          recusar() {
            printf '%s\n' "$1" > "$resposta"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          comando=$(python3 -c 'import os; print(os.environ["CORPO"].strip())')
          if [[ "$comando" != "/approve" ]]; then
            if [[ "$comando" == /approve* ]]; then
              recusar "Nada foi aprovado: o comando precisa ser exatamente \`/approve\`, sozinho no comentário."
            fi
            # Comentário que só menciona /approve no meio do texto: não é comando, não responde.
            echo "silencioso=true" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `permission` é o papel legado: maintain aparece como write, triage como read.
          permissao=$(gh api "repos/$REPO/collaborators/$LOGIN/permission" --jq .permission)
          case "$permissao" in
            admin|write) ;;
            *) recusar "Nada foi aprovado: @$LOGIN não tem permissão de escrita no repositório (tem \`$permissao\`)." ;;
          esac

          pr=$(gh api "repos/$REPO/pulls/$PR")
          estado=$(jq -r .state <<<"$pr")
          repo_head=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          head_ref=$(jq -r .head.ref <<<"$pr")
          head_sha=$(jq -r .head.sha <<<"$pr")
          base_ref=$(jq -r .base.ref <<<"$pr")
          [[ "$estado" == "open" ]] || recusar "Nada foi aprovado: o PR não está aberto."
          # O GITHUB_TOKEN não escreve em fork, e código de fork não roda com token de escrita.
          [[ "$repo_head" == "$REPO" ]] || recusar "Nada foi aprovado: PR vindo de fork não é suportado. Abra o PR a partir de um branch deste repositório."

          # Aprova só o head que existia quando o comentário foi feito. A última atividade do
          # branch (push, force push, criação) diz quando o head atual foi publicado.
          read -r sha_atividade publicado_em < <(
            gh api -X GET "repos/$REPO/activity" -f ref="refs/heads/$head_ref" -F per_page=1 \
              --jq '.[0] // {} | "\(.after // "-") \(.timestamp // "-")"'
          ) || true
          if [[ "${sha_atividade:-}" != "$head_sha" ]]; then
            recusar "Nada foi aprovado: não consegui confirmar quando o head atual (\`${head_sha:0:12}\`) foi publicado. Confira o PR e comente \`/approve\` de novo."
          fi
          if (( $(date -u -d "$publicado_em" +%s) > $(date -u -d "$COMENTARIO_EM" +%s) )); then
            recusar "Nada foi aprovado: o PR recebeu push em $publicado_em, depois do seu comentário ($COMENTARIO_EM). Revise o head atual (\`${head_sha:0:12}\`) e comente \`/approve\` de novo."
          fi

          {
            echo "ok=true"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"

      # O script vem do branch default (github.sha), não do PR: o código do PR não roda com
      # este token de escrita.
      - name: Checkout do script (branch default)
        if: steps.pre.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          path: ferramenta
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout do head revisado
        if: steps.pre.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pre.outputs.head_sha }}
          path: pr
          fetch-depth: 0

      - name: Registra a aprovação e faz push
        id: aprovar
        if: steps.pre.outputs.ok == 'true'
        working-directory: pr
        env:
          HEAD_REF: ${{ steps.pre.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pre.outputs.head_sha }}
          BASE_REF: ${{ steps.pre.outputs.base_ref }}
        run: |
          set -euo pipefail
          resposta="$RUNNER_TEMP/resposta.md"
          script="$GITHUB_WORKSPACE/ferramenta/.github/scripts/spec_aprovacao.py"
          recusar() {
            printf '%s\n' "$1" > "$resposta"
            exit 0
          }

          lista=$(python3 "$script" alteradas --base "origin/$BASE_REF")
          [[ -n "$lista" ]] || recusar "Nada foi aprovado: este PR não altera nenhuma capability spec (\`specs/<capability>/<capability>.md\` com \`capability_id\` no front matter)."
          mapfile -t specs <<<"$lista"

          # approved_at é a hora do comentário: é o momento em que a pessoa aprovou.
          em=$(date -u -d "$COMENTARIO_EM" +%Y-%m-%dT%H:%M:%SZ)
          # shellcheck disable=SC2016 # crases literais (bloco de código Markdown)
          if ! saida=$(python3 "$script" aprovar --login "$LOGIN" --em "$em" "${specs[@]}" 2>&1); then
            recusar "$(printf 'Nada foi aprovado: front matter fora do formato esperado.\n\n```\n%s\n```' "$saida")"
          fi
          echo "$saida"
          git add -- "${specs[@]}"

          caps=""
          linhas=""
          for arq in "${specs[@]}"; do
            cap=$(sed -n 's/^capability_id:[[:space:]]*//p' "$arq" | head -n1)
            caps="${caps:+$caps, }$cap"
            linhas+="| \`$arq\` | \`$cap\` |"$'\n'
          done

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --file - <<EOF
          chore(spec): aprova $caps ($LOGIN)

          Aprovação registrada pelo comando /approve de $LOGIN em $COMENTARIO_URL
          Head revisado: $HEAD_SHA
          EOF

          # Sanidade: a aprovação recém-gravada tem de passar no guard de invalidação.
          python3 "$script" verificar --base "origin/$BASE_REF"

          # Sem --force: se o branch andou durante este job, o push é rejeitado e nada é gravado.
          if ! git push origin "HEAD:refs/heads/$HEAD_REF"; then
            recusar "Nada foi aprovado: o branch \`$HEAD_REF\` mudou enquanto a aprovação era gravada. Revise o head novo e comente \`/approve\` de novo."
          fi
          commit=$(git rev-parse HEAD)
          echo "aprovado=true" >> "$GITHUB_OUTPUT"

          cat > "$resposta" <<EOF
          **Spec aprovada por @$LOGIN** em $em.

          - Head revisado (o que estava no PR quando você comentou): \`$HEAD_SHA\`
          - Commit da aprovação: \`$commit\`

          | Arquivo | Capability |
          |---|---|
          $linhas
          O \`status\` da spec não muda aqui. Qualquer alteração posterior na spec invalida esta aprovação (check **Aprovação de spec válida**); aí é revisar e comentar \`/approve\` de novo.

          O GitHub não informa ao workflow se você marcou o arquivo como *Viewed*: ao comentar \`/approve\` você declara ter revisado o head acima. O commit da aprovação foi feito com \`GITHUB_TOKEN\` e por isso não dispara o CI.
          EOF

      - name: Responde no comentário
        if: always() && steps.pre.outputs.silencioso != 'true'
        env:
          APROVADO: ${{ steps.aprovar.outputs.aprovado }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          resposta="$RUNNER_TEMP/resposta.md"
          [[ -s "$resposta" ]] || printf 'Nada foi aprovado: falha inesperada no workflow. Detalhes em %s\n' "$RUN_URL" > "$resposta"
          if [[ "$APROVADO" == "true" ]]; then reacao='+1'; else reacao='-1'; fi
          gh api "repos/$REPO/issues/comments/$COMENTARIO_ID/reactions" -f content="$reacao" > /dev/null
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$resposta" > /dev/null
